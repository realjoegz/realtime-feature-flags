name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to the commit of the release named in its comment. A tag
# can be moved by the action's owner; a commit cannot.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.0
          cache: npm

      # Installs exactly what package-lock.json pins, and fails if it is out of date.
      - run: npm ci

      # Lint, format check, typecheck, build, all tests, then the claim checker and the
      # README word cap. The same command runs locally.
      - run: npm run verify

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: .vitest/
          include-hidden-files: true
          if-no-files-found: ignore
