name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to the commit of the release named in its comment. A tag
# can be moved by the action's owner; a commit cannot. The runner image is pinned to
# Ubuntu 24.04 as well, so a new ubuntu-latest does not change the build.
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.13.0
          cache: npm

      # Installs exactly what package-lock.json pins, and fails if it is out of date.
      - run: npm ci

      # The API tests create their own database on this Postgres and use their own
      # key prefix on this Redis (apps/api/test/harness).
      - name: Start Postgres and Redis
        run: docker compose up --detach --wait postgres redis

      # Lint, format check, typecheck, build, all tests, then the claim checker and the
      # README word cap. The same command runs locally.
      - run: npm run verify

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: .vitest/
          include-hidden-files: true
          if-no-files-found: ignore

  # The whole compose stack from a clean checkout: the API image builds, migrate exits
  # 0, both replicas turn healthy, and scripts/demo.sh passes against them.
  local-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and start the stack
        run: docker compose up --build --detach --wait

      - name: Run the demo
        run: scripts/demo.sh

      - name: Show the compose logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
